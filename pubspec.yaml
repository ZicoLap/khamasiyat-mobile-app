name: khamasiyat_mobile_app
description: Khamasiyat Customer mobile application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management & DI
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Networking
  dio: ^5.8.0+1

  # Secure session storage (tokens)
  flutter_secure_storage: ^9.2.4

  # Non-secret preferences (e.g. locale)
  shared_preferences: ^2.5.3

  # Localization & formatting
  intl: ^0.19.0

  # Request IDs
  uuid: ^4.5.1

  # Testable clock
  clock: ^1.1.2
  url_launcher: ^6.3.2
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/home_hero_football.png
